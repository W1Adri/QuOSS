[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quoss"
description = "Quantum Optical Satellite Simulator — vectorized satellite QKD link and system modelling"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Adrià Sancho", email = "francesc.adria.sancho@gmail.com" }]
keywords = ["qkd", "satellite", "quantum", "optical-communications", "simulation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dynamic = ["version"]

# The core must install with very little: arrays, science, schema. Nothing else.
# sgp4 is in this list and not in an optional group: orbits/tle.py wraps it
# rather than reimplementing SGP4, per notes/ROADMAP.md 2.1.5, and a TLE is
# useless without a propagator for it.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.7",
    "sgp4>=2.23",
    # The scenario is a datum, not a request (README, principle 1), and the datum
    # is a YAML file: scenario/io.py reads and writes it. Stage 4.
    "pyyaml>=6.0",
]

# `quoss run scenario.yaml` and friends. Stage 7; argparse, no CLI framework.
[project.scripts]
quoss = "quoss.cli.main:main"

[project.optional-dependencies]
# Publication figures (matplotlib style sheet lives in quoss.viz).
viz = [
    "matplotlib>=3.8",
]
# Columnar export of results (io/export.py). CSV and the JSON manifest need
# nothing; Parquet needs pyarrow, which is **152 MiB installed** and not a
# physics dependency.
#
# That figure said "40 MB" until 2026-09-19 and was never measured. Measured now
# (`du -sh .venv/lib/python3.13/site-packages/pyarrow`, CPython 3.13, Linux
# x86-64): 152 MiB, which is 3.8x what the comment claimed and **more than numpy
# and scipy together** (31.6 + 90.4 = 122 MB of file bytes, against pyarrow's
# 157 MB). The decision the number defended -- an extra, never a requirement of
# the physics core -- is not weakened by the correction, it is the only reading
# left: this optional format is the single largest thing the project can pull
# in, bigger than the whole numerical stack it is built on. A comment that
# defends a dependency with a number nobody checked is the defect ADR 0016
# exists to prevent, one layer out from the physics.
export = [
    "pyarrow>=15",
]
# Optional numeric kernels. Only pulled in when the profiler asks for them.
accel = [
    "numba>=0.60",
]
# HTTP layer. FastAPI is an extra, never a requirement of the physics core.
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
]

[project.urls]
Homepage = "https://github.com/W1Adri/QuOSS"
Repository = "https://github.com/W1Adri/QuOSS"
Issues = "https://github.com/W1Adri/QuOSS/issues"

# PEP 735 group: tooling only, never shipped to users of the package.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]
# Independent oracles for generating the frozen reference data in
# tests/golden/data/. NOT a default group: CI never installs it and never needs
# it, because the reference values are committed. Run the generators with
#   uv run --group reference python tests/golden/generators/<script>.py
# See tests/golden/README.md for why the split exists.
reference = [
    "astropy>=6.0",
]

[tool.hatch.version]
path = "src/quoss/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quoss"]

# --------------------------------------------------------------------------- #
# ruff — lint + format (replaces black / isort / flake8)
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

# The formatter's job is source code; the .md files here are prose. Ruff gained
# Markdown support in a release later than the `ruff>=0.6` floor below, and
# started reformatting the ```python blocks of the notes and ADRs as a side
# effect nobody asked for — which turned `ruff format --check` in CI red over
# hand-aligned comments that are aligned on purpose, because a three-line block
# comparing two behaviours is only readable as a column (CLAUDE.md, norm 1).
#
# What this gives up is nothing but cosmetics, and that is measured rather than
# assumed: pointed at a .md holding a deliberately broken snippet (unused
# import), `ruff check` answers `warning: No Python files found` and reports
# clean, while the same code in a .py is flagged. The linter — the only half of
# ruff that can find a defect — does not read Markdown at all. Snippets inside
# *docstrings* stay covered, by `docstring-code-format` under [tool.ruff.format].
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "ARG",  # unused arguments
    "PTH",  # use pathlib
    "NPY",  # numpy-specific rules
    "RUF",  # ruff-specific rules
    "D",    # pydocstyle — the physics docstrings are the physics manual
]
ignore = [
    "E501",   # line length is the formatter's job
    "D105",   # magic methods need no docstring
    "D107",   # __init__ documented at class level
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
]

# RUF001-003 flag characters that look like ASCII but are not, because they hide
# typos. These four are not typos: they are how the sources this project quotes
# print their own tables, and quoting a published value is the one place where
# the typography is part of the citation (ADR 0009). "5 x 10-7" and "5 × 10−7"
# are the same number, but only the second is what SatQuMA's Table I says, and a
# reader checking the citation against the PDF should find the same string.
allowed-confusables = ["−", "×", "≤", "≥"]

[tool.ruff.lint.per-file-ignores]
# Test names are the documentation. A docstring is welcome where the "why" is
# non-obvious, but requiring one on every `test_speed_of_light` is noise.
# SIM300: treats an UPPERCASE attribute as a literal and rewrites
# `assert MY_CONSTANT == pytest.approx(expected)` into Yoda form. Wrong for a
# module of named constants, where the constant under test belongs on the left.
# D403: auto-capitalises the first word, which silently rewrites a physics
# symbol — `sigma` -> `Sigma`, and `e` (eccentricity) -> `E` (energy).
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D403", "ARG", "SIM300"]
"benchmarks/**" = ["D100", "D103"]
"validation/**" = ["D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------- #
# mypy — permissive by default, strict where typing actually pays: core+physics
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
# On since 2026-09-19. It was false because the per-module sections below were
# forward-looking -- they covered modules the roadmap creates in stages 1-4 --
# and warning about them until then was noise. Every one of those stages is
# written now, so the flag has nothing left to excuse; turned on, it named
# exactly three dead sections (`quoss.kernels.*`, `numba.*`, `pyarrow.*`) and
# all three are gone, each with its reason at the removal site.
#
# What it does *not* do, said here because it is easy to over-read: mypy emits
# this as a `note:` and still exits 0, so it reports and cannot fail CI. What
# fails is tests/unit/test_project_config.py, which asserts the same property
# from the other side -- every module pattern in the sections below names
# something that exists.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
# `strict` cannot be set per-module, so the strict flags are spelled out here.
module = [
    "quoss.core.*",
    "quoss.orbits.*",
    "quoss.channel.*",
    "quoss.qkd.*",
    "quoss.system.*",
    "quoss.scenario.*",
    "quoss.engine.*",
    "quoss.validation.*",
    "quoss.cli.*",
    "quoss.dossier.*",
]
# `quoss.kernels.*` was in this list from stage 0 and left it on 2026-09-19.
# Stage 2.4 is not written and ADR 0026 says no measurement of today justifies
# it, so the entry was strictness promised to a package that does not exist --
# and `warn_unused_configs` named it the moment it was turned on. Putting it
# back costs one line the day `kernels/` is written; leaving it in costs a
# config nobody can tell is live.
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
warn_return_any = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
# astropy and erfa appear only in tests/golden/generators/, which are not
# installed in the default environment, so mypy cannot see them.
# `numba.*` and `pyarrow.*` left this list on 2026-09-19 for the same reason:
# neither is imported anywhere mypy looks. numba belongs to the unwritten stage
# 2.4; pyarrow is reached only through `importlib.import_module` in
# `io/export.py`, deliberately, so that Parquet stays an extra -- and a module
# mypy never sees needs no override for its missing stubs.
module = ["scipy.*", "matplotlib.*", "sgp4.*", "astropy.*", "erfa.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    # The docstrings are the physics manual (see the autogenerated-docs goal in
    # notes/archive/GUIA_REIMPLEMENTACION-v3.md §5). Running their examples is what
    # the manual from drifting away from the code.
    "--doctest-modules",
    # Reference-data generators import astropy, which is a non-default dependency
    # group on purpose (see tests/golden/README.md). --doctest-modules would
    # otherwise import them during collection and fail in a clean environment.
    "--ignore=tests/golden/generators",
]
markers = [
    "physics: invariants and property-based physics checks",
    # SimulCTTC is deliberately NOT an oracle: it was never validated, and reading
    # it turned up defects that freezing its output would have canonised. See
    # tests/golden/README.md for the four verification levels this marker spans.
    "reference: comparison against frozen values from an independent oracle",
    "regression: comparison against a frozen snapshot of QuOSS's own output",
    "slow: excluded from the fast feedback loop",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/quoss"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
